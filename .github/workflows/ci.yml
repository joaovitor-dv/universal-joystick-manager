name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unit tests (fake sysfs, no hardware)
        run: bash tests/test_slots.sh

      - name: Syntax checks
        run: |
          bash -n joystickmanager.sh
          bash -n joystickmanager-doctor
          bash -n install.sh
          bash -n tests/test_slots.sh
          python3 -m py_compile switchpro-leds.py
          python3 -m py_compile bridge/ujm-bridge bridge/tests/test_bridge.py bridge/tests/fake_bluez.py
          xmllint --noout --nonet bridge/org.ujm.Manager1.conf bridge/org.ujm.manager.policy

      - name: Bridge tests (private D-Bus session, fake BlueZ and polkit)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends python3-gi gir1.2-glib-2.0 dbus libxml2-utils
          dbus-run-session -- python3 -W ignore bridge/tests/test_bridge.py

      - name: Validate the udev rule
        run: udevadm verify udev/99-joystickmanager-procontroller-charge-only.rules

      - name: Profile table is well formed
        run: |
          awk -F'\t' '!/^#/ && NF != 7 { printf "line %d has %d fields, expected 7\n", NR, NF; bad=1 } END { exit bad }' controllers.tsv

  ui:
    name: Interface (headless Chrome)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Inline scripts parse
        run: |
          python3 - <<'PY'
          import re, subprocess, tempfile
          html = open('ui/index.html', encoding='utf-8').read()
          for i, js in enumerate(re.findall(r'<script[^>]*>(.*?)</script>', html, re.S)):
              with tempfile.NamedTemporaryFile('w', suffix='.js', delete=False) as f:
                  f.write(js)
              subprocess.run(['node', '--check', f.name], check=True)
              print('script', i, 'ok')
          PY
      - name: Browser tests
        env:
          CHROME: google-chrome
          CI: "1"
        run: ui/tests/run.sh

  packages:
    name: Packages (deb and rpm, informational)
    runs-on: ubuntu-latest
    # Informational until the first green runs: these packages cannot be built on the maintainers' machine.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends build-essential debhelper dpkg-dev rpm
      - name: Build and check the .deb
        run: |
          cp -r packaging/debian debian
          dpkg-buildpackage -us -uc -b
          deb=$(ls ../universal-joystick-manager_*_all.deb)
          dpkg-deb -c "$deb"
          dpkg-deb -c "$deb" | grep -q 'usr/lib/joystickmanager/ujm-bridge'
          dpkg-deb -c "$deb" | grep -q 'usr/share/polkit-1/actions/org.ujm.manager.policy'
          dpkg-deb -c "$deb" | grep -q 'usr/lib/joystickmanager/switchpro-leds'
          dpkg-deb --fsys-tarfile "$deb" | tar -xO ./lib/systemd/system/joystickmanager.service | grep -q '^ExecStart=/usr/bin/joystickmanager.sh$'
      - name: Build and check the .rpm
        run: |
          rpmbuild -bb --define "_sourcedir $PWD" --define "_topdir $RUNNER_TEMP/rpm" --define "_unitdir /usr/lib/systemd/system" packaging/fedora/universal-joystick-manager.spec
          rpm=$(ls "$RUNNER_TEMP"/rpm/RPMS/noarch/*.rpm)
          rpm -qlp "$rpm"
          rpm -qlp "$rpm" | grep -q 'libexec/ujm-bridge$'
          rpm -qlp "$rpm" | grep -q 'polkit-1/actions/org.ujm.manager.policy$'
          rpm -qlp "$rpm" | grep -q 'joystickmanager-switchpro-leds$'
          rpm2cpio "$rpm" | cpio -i --to-stdout ./usr/lib/systemd/system/joystickmanager.service 2>/dev/null | grep -q '^ExecStart=/usr/bin/joystickmanager.sh$'

  shellcheck:
    name: ShellCheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: ShellCheck
        run: shellcheck -S warning joystickmanager.sh joystickmanager-doctor install.sh tests/test_slots.sh
