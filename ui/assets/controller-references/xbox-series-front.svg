<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 703" role="img" aria-label="Xbox Series controller front outline with hybrid D-pad and four separate shoulder controls">
  <title>Xbox Series X/S — front diagram</title>
  <desc>Transparent vector line drawing. Colored face buttons and the Share control are supplied by the interface.</desc>
  <g fill="none" stroke="#e5edf4" stroke-linecap="round" stroke-linejoin="round">
    <!-- The four controls are independent silhouettes, above—not painted into—the shell. -->
    <g stroke-width="3.5" font-family="sans-serif" font-weight="700" font-size="21" text-anchor="middle">
      <g data-shoulder-control="LT"><path d="M77 49 84 21Q89 8 110 8h17q22 0 27 15l7 26Z"/><text x="119" y="37" fill="#f4f8fc" stroke="none">LT</text></g>
      <g data-shoulder-control="LB"><path d="M157 73q40-18 96-18 13 0 21 12l6 17q-66-7-123 8Z"/><text x="216" y="79" fill="#f4f8fc" stroke="none">LB</text></g>
      <g data-shoulder-control="RB"><path d="M843 73q-40-18-96-18-13 0-21 12l-6 17q66-7 123 8Z"/><text x="784" y="79" fill="#f4f8fc" stroke="none">RB</text></g>
      <g data-shoulder-control="RT"><path d="M923 49 916 21q-5-13-26-13h-17q-22 0-27 15l-7 26Z"/><text x="881" y="37" fill="#f4f8fc" stroke="none">RT</text></g>
    </g>
    <!-- Series shell: rounder, shorter grips and a raised central bridge, unlike the One. -->
    <path id="series-shell" stroke-width="4.2" d="M339 127q-36-2-66-13-27-10-57-10-65 0-103 43-26 29-37 80L34 440q-16 76-8 135 7 68 50 105 22 19 53 20 32 0 54-29l87-123q24-34 71-35h318q47 1 71 35l87 123q22 29 54 29 31-1 53-20 43-37 50-105 8-59-8-135l-42-213q-11-51-37-80-38-43-103-43-30 0-57 10-30 11-66 13Z"/>
    <path stroke="#aebfcb" stroke-width="3" d="M126 168q49-48 112-40 50 6 90 25 28 13 59 13h226q31 0 59-13 40-19 90-25 63-8 112 40"/>
    <path stroke="#aebfcb" stroke-width="2.7" d="M274 542q25-40 81-43h290q56 3 81 43"/>
    <!-- Left and right clickable sticks: distinct rings, no opaque disks. -->
    <g id="left-stick" stroke-width="3.2"><circle cx="237" cy="240" r="73"/><circle cx="237" cy="240" r="57" stroke="#b7c9d5"/><circle cx="237" cy="240" r="41"/><path d="M213 274q24 12 48 0" stroke="#aebfcb"/></g>
    <g id="right-stick" stroke-width="3.2"><circle cx="641" cy="402" r="72"/><circle cx="641" cy="402" r="56" stroke="#b7c9d5"/><circle cx="641" cy="402" r="41"/><path d="M617 435q24 12 48 0" stroke="#aebfcb"/></g>
    <!-- The Series hybrid D-pad has a circular, faceted eight-direction bowl. -->
    <g id="hybrid-dpad" stroke-width="3.4">
      <circle cx="361" cy="407" r="79"/>
      <path id="hybrid-dpad-facets" stroke="#b7c9d5" d="m361 338 46 22 23 47-23 47-46 22-46-22-23-47 23-47Z"/>
      <path d="m342 350 19-12 19 12v38h39l11 19-11 19h-39v38l-19 12-19-12v-38h-39l-11-19 11-19h39Z"/>
      <path stroke="#aebfcb" stroke-width="2" d="m342 350 19 19 19-19m-19 126v-41m-69-28h44m94 0h-44"/>
    </g>
    <!-- Home, View and Menu have their own outlined hardware shapes. -->
    <g id="system-buttons" stroke-width="3">
      <circle cx="500" cy="188" r="33"/>
      <path d="m482 171 18 14 18-14-11 17 11 17-18-14-18 14 11-17Z"/>
      <rect x="415" y="243" width="33" height="27" rx="9"/><path d="M422 251h13v11h-13Zm7 4h13v11h-13" stroke-width="2"/>
      <rect x="552" y="243" width="33" height="27" rx="9"/><path d="M561 251h15m-15 6h15m-15 6h15" stroke-width="2"/>
    </g>
  </g>
</svg>
