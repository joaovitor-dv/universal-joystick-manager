<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<busconfig>
  <!-- Only root owns the name. Anyone may call it: reads are public (the snapshot is world
       readable) and every action asks polkit (org.ujm.manager.policy). -->
  <policy user="root">
    <allow own="org.ujm.Manager1"/>
  </policy>
  <policy context="default">
    <allow send_destination="org.ujm.Manager1"/>
    <allow send_destination="org.ujm.Manager1" send_interface="org.freedesktop.DBus.Properties"/>
    <allow send_destination="org.ujm.Manager1" send_interface="org.freedesktop.DBus.Introspectable"/>
  </policy>
</busconfig>
